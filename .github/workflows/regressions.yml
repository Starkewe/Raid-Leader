name: Regression Gate

on:
  push:
  pull_request:

jobs:
  headless-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          echo "GODOT_BIN=/tmp/godot/Godot_v4.7.1-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Prove exit-zero failures are rejected
        shell: pwsh
        run: ./tools/verify_regression_runner.ps1 -GodotPath $env:GODOT_BIN

      - name: Import and run regression manifest
        shell: pwsh
        run: ./tools/run_regressions.ps1 -GodotPath $env:GODOT_BIN

      - name: Check whitespace
        shell: bash
        run: git diff --check
